<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f12">
    <title>Aura Enterprise | Ultimate 3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main-start: #090a0f;
            --bg-main-end: #151828;
            --bg-main: linear-gradient(135deg, var(--bg-main-start) 0%, var(--bg-main-end) 100%);
            --glass-bg: rgba(20, 22, 35, 0.6);
            --glass-border: rgba(255, 255, 255, 0.05);
            --accent: #00d2ff;
            --accent-secondary: #3a7bd5;
            --accent-grad: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            --text-main: #ffffff;
            --text-muted: #8b95a5;
            --gold: #ffd700;
            --font-main: 'Inter', sans-serif;
            --z-modal: 1010;
            --z-splash: 9999;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-main);
            background: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* Оптимизированные стили скроллбара */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150, 150, 150, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* Splash Screen */
        .splash-screen {
            position: fixed; inset: 0;
            background: #000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: var(--z-splash);
            transition: opacity 0.8s;
        }
        .splash-title {
            margin-top: 50px; font-size: 2.5rem; font-weight: 900;
            background: var(--accent-grad);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        
        /* Layout каркас */
        .app-container { display: flex; width: 100%; height: 100%; }
        .sidebar { width: 380px; background: var(--glass-bg); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; }
        .chat-area { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* Кнопки */
        .btn { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-primary { background: var(--accent-grad); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4); }
    </style>
</head>
<body>

    <div id="splash" class="splash-screen">
        <h1 class="splash-title">AURA</h1>
        <p style="color: var(--text-muted); margin-top: 10px;">ENTERPRISE SYSTEM INITIALIZING...</p>
    </div>

    <div class="app-container" id="app" style="display: none;">
        <aside class="sidebar">
            <div style="padding: 20px; border-bottom: 1px solid var(--glass-border);">
                <h2>Aura</h2>
            </div>
            <div id="chatList" style="flex: 1; overflow-y: auto;"></div>
        </aside>

        <main class="chat-area">
            <div id="noChatOverlay" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.5);">
                <div style="text-align: center;">
                    <h2>Выберите чат</h2>
                    <p style="color: var(--text-muted);">или создайте новый для начала общения</p>
                </div>
            </div>
            
            <header id="chatHeader" style="display: none; padding: 20px; border-bottom: 1px solid var(--glass-border);"></header>
            <div id="chatMessages" style="flex: 1; overflow-y: auto; padding: 20px;"></div>
            <div id="inputArea" style="display: none; padding: 20px; border-top: 1px solid var(--glass-border);">
                </div>
        </main>
    </div>

    <script>
        // Изолируем стейт приложения, чтобы переменные не перемешивались
        const AppState = {
            currentUser: null,
            activeChatId: null,
            activeChatType: null
        };

        // БЕЗОПАСНАЯ БАЗА ДАННЫХ
        // Исправлен баг: добавлена защита от переполнения квоты картинок (try/catch)
        const DB = {
            get: (key, defaultValue = null) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    console.error('Ошибка чтения БД:', e);
                    return defaultValue;
                }
            },
            set: (key, value) => {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {
                    if (e.name === 'QuotaExceededError') {
                        alert("⚠️ Память устройства переполнена. Очистите историю чатов, чтобы отправлять новые медиафайлы.");
                    }
                }
            }
        };

        // ЗАЩИТА ОТ XSS (Взлома через сообщения)
        // Раньше хакер мог отправить скрипт в чат. Теперь текст безопасно экранируется.
        const Security = {
            escapeHTML: (str) => {
                if (!str) return '';
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                    }[tag])
                );
            }
        };

        // ИНИЦИАЛИЗАЦИЯ
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    // Здесь позже будет вызов Auth.init()
                }, 800);
            }, 1500);
        });
    </script>
</body>
</html>
