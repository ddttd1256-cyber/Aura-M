<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f12">
    <title>Aura Messenger | Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ТЕМИЗАЦИЯ
           ========================================================================== */
        :root {
            --bg-main: #0d0f12;
            --glass-bg: rgba(25, 26, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #8b8d96;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.3);
            --danger: #ff3b3b;
            --success: #00e676;
            --msg-out: rgba(0, 210, 255, 0.15);
            --msg-in: rgba(255, 255, 255, 0.05);
            --font-family: 'Inter', sans-serif;
        }

        [data-theme="light"] {
            --bg-main: #f0f2f5;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text-main: #1a1b26;
            --text-muted: #6b7280;
            --msg-out: rgba(0, 210, 255, 0.2);
            --msg-in: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font-family); -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; transition: background 0.3s ease; }
        
        /* Скроллбары */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }

        /* ==========================================================================
           АВТОРИЗАЦИЯ И СПЛЭШ
           ========================================================================== */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
        .logo-text { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, var(--text-main), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; margin-bottom: 20px; }
        .progress-container { width: 200px; height: 4px; background: var(--glass-border); border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); transition: width 1s ease; }

        .auth-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 9998; justify-content: center; align-items: center; }
        .auth-box { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; }
        .auth-input { width: 100%; padding: 15px; margin: 10px 0; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); font-size: 1rem; outline: none; transition: border-color 0.3s; }
        .auth-input:focus { border-color: var(--accent); }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 15px var(--accent-glow); }
        .btn-primary:active { transform: scale(0.98); }

        /* ==========================================================================
           ОСНОВНОЙ ЛЕЙАУТ
           ========================================================================== */
        #app { display: none; width: 100%; height: 100%; }
        
        /* ЛЕВАЯ ПАНЕЛЬ: СПИСОК ЧАТОВ И КАНАЛОВ */
        .sidebar { width: 350px; background: var(--glass-bg); backdrop-filter: blur(10px); border-right: 1px solid var(--glass-border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { font-size: 1.5rem; font-weight: 700; }
        .add-btn { background: var(--glass-border); border: none; color: var(--text-main); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .add-btn:hover { background: var(--accent); color: #fff; }
        
        .search-bar { padding: 15px 20px; }
        .search-input { width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--text-main); outline: none; }
        
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 15px 20px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid transparent; }
        .chat-item:hover, .chat-item.active { background: var(--glass-border); }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: var(--accent); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; color: #fff; margin-right: 15px; flex-shrink: 0; background-size: cover; background-position: center;}
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; font-size: 1.05rem; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .channel-badge { background: var(--accent); color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: bold;}
        .chat-last-msg { color: var(--text-muted); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ПРАВАЯ ПАНЕЛЬ: ЧАТ / КАНАЛ */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); position: relative;}
        .chat-header { padding: 15px 20px; background: var(--glass-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; z-index: 10;}
        .chat-header-info { display: flex; align-items: center; }
        .chat-header-actions { display: flex; gap: 10px; }
        .action-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .action-btn:hover { background: var(--glass-border); color: var(--accent); }
        
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 70%; padding: 12px 16px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; position: relative; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-out { align-self: flex-end; background: var(--msg-out); border-bottom-right-radius: 4px; border: 1px solid var(--glass-border); }
        .msg-in { align-self: flex-start; background: var(--msg-in); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
        .msg-system { align-self: center; background: rgba(0,0,0,0.3); color: var(--text-muted); font-size: 0.8rem; padding: 5px 15px; border-radius: 10px; max-width: 90%; text-align: center; border: 1px solid var(--glass-border);}
        
        .msg-time { display: block; font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; text-align: right; }

        .input-area { padding: 15px 20px; background: var(--glass-bg); border-top: 1px solid var(--glass-border); display: flex; gap: 10px; align-items: center; }
        .msg-input { flex: 1; padding: 15px 20px; background: rgba(0,0,0,0.2); border: 1px solid var(--glass-border); border-radius: 20px; color: var(--text-main); font-size: 1rem; outline: none; }
        .send-btn { background: var(--accent); color: #fff; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; box-shadow: 0 4px 15px var(--accent-glow); transition: 0.2s;}
        .send-btn:active { transform: scale(0.9); }

        .read-only-banner { width: 100%; padding: 20px; text-align: center; color: var(--text-muted); background: var(--glass-bg); border-top: 1px solid var(--glass-border); font-size: 0.95rem; display: none; }

        /* ==========================================================================
           МОДАЛЬНЫЕ ОКНА И ЗВОНКИ
           ========================================================================== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 10000; justify-content: center; align-items: center; }
        .modal-content { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; }
        .modal-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: 600; text-align: center;}
        
        /* ИНТЕРФЕЙС ЗВОНКА */
        #callModal { background: #0d0f12; }
        .call-wrapper { display: flex; flex-direction: column; align-items: center; height: 100%; width: 100%; position: absolute; top:0; left:0; padding: 50px 20px; background: radial-gradient(circle at center, #1a1b26 0%, #0d0f12 100%);}
        .call-avatar { width: 150px; height: 150px; border-radius: 50%; background: var(--glass-border); margin: 40px 0 20px; display: flex; justify-content: center; align-items: center; font-size: 4rem; position: relative; z-index: 2; background-size: cover;}
        
        /* Пульсация при звонке */
        .call-avatar.ringing::before, .call-avatar.ringing::after {
            content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: var(--accent); opacity: 0.3; z-index: -1; animation: pulse 2s infinite ease-out;
        }
        .call-avatar.ringing::after { animation-delay: 1s; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(2); opacity: 0; } }

        .call-name { font-size: 2rem; font-weight: 700; margin-bottom: 10px; }
        .call-status { font-size: 1rem; color: var(--text-muted); margin-bottom: auto;}
        
        .call-controls { display: flex; gap: 20px; margin-bottom: 40px; background: rgba(0,0,0,0.4); padding: 15px 30px; border-radius: 40px; border: 1px solid var(--glass-border);}
        .ctrl-btn { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; transition: 0.3s; color: white; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);}
        .ctrl-btn.active { background: rgba(255,255,255,0.9); color: black; }
        .ctrl-btn.end-call { background: var(--danger); box-shadow: 0 0 20px rgba(255, 59, 59, 0.4); }
        .ctrl-btn.end-call:hover { background: #ff1a1a; }
        
        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: absolute; z-index: 100; transition: transform 0.3s; }
            .sidebar.hidden { transform: translateX(-100%); }
            .chat-area { width: 100%; }
            .back-btn { display: flex !important; }
        }
        .back-btn { display: none; background: transparent; border: none; color: var(--text-main); font-size: 1.5rem; margin-right: 15px; cursor: pointer; }

    </style>
</head>
<body>

    <div id="splash">
        <div class="logo-text">AURA</div>
        <div class="progress-container"><div class="progress-bar" id="splashBar"></div></div>
    </div>

    <div class="auth-container" id="authModal">
        <div class="auth-box">
            <h2 style="margin-bottom: 20px; font-weight: 700;">Вход в систему</h2>
            <input type="text" id="authUsername" class="auth-input" placeholder="Введите ваш Username" autocomplete="off">
            <button class="btn btn-primary" onclick="login()">Продолжить</button>
        </div>
    </div>

    <div id="app">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Aura</h2>
                <div>
                    <button class="add-btn" onclick="openModal('createChannelModal')" title="Создать канал">📢</button>
                </div>
            </div>
            <div class="search-bar">
                <input type="text" class="search-input" placeholder="Поиск чатов и каналов..." onkeyup="filterChats(this.value)">
            </div>
            <div class="chat-list" id="chatList">
                </div>
        </div>

        <div class="chat-area" id="chatArea" style="display: none;">
            <div class="chat-header">
                <div class="chat-header-info">
                    <button class="back-btn" onclick="closeChat()">←</button>
                    <div class="avatar" id="currentChatAvatar"></div>
                    <div>
                        <div class="chat-name" id="currentChatName">Name</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);" id="currentChatSubtext"></div>
                    </div>
                </div>
                <div class="chat-header-actions" id="chatActions">
                    <button class="action-btn" onclick="initiateCall('audio')" title="Аудиозвонок">📞</button>
                    <button class="action-btn" onclick="initiateCall('video')" title="Видеозвонок">📹</button>
                </div>
            </div>
            
            <div class="messages-container" id="messagesContainer">
                </div>

            <div class="input-area" id="inputArea">
                <input type="text" class="msg-input" id="messageInput" placeholder="Введите сообщение..." onkeypress="handleEnter(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
            <div class="read-only-banner" id="readOnlyBanner">
                Вы являетесь подписчиком этого канала. Публикация доступна только администратору.
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="createChannelModal">
        <div class="modal-content">
            <h3 class="modal-title">Создать канал</h3>
            <input type="text" id="newChannelName" class="auth-input" placeholder="Название канала">
            <input type="text" id="newChannelDesc" class="auth-input" placeholder="Описание (необязательно)">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button class="btn" style="background: var(--glass-border); color: var(--text-main);" onclick="closeModal('createChannelModal')">Отмена</button>
                <button class="btn btn-primary" onclick="createChannel()">Создать</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="callScreenModal" style="z-index: 100000;">
        <div class="call-wrapper">
            <div class="call-avatar ringing" id="callAvatarElem">A</div>
            <div class="call-name" id="callNameElem">User</div>
            <div class="call-status" id="callStatusElem">Установка соединения...</div>
            
            <div class="call-controls">
                <button class="ctrl-btn" id="btnMic" onclick="toggleMic()">🎤</button>
                <button class="ctrl-btn" id="btnVid" onclick="toggleVideo()">📹</button>
                <button class="ctrl-btn end-call" onclick="endCall()">📴</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================================
           ЯДРО СИСТЕМЫ И СОСТОЯНИЯ (AURA ENTERPRISE ENGINE)
           ========================================================================== */
        let currentUser = null;
        let activeChatId = null;
        let callEngine = { active: false, timerInterval: null, seconds: 0 };
        
        // База данных по умолчанию (для демонстрации)
        const defaultDB = [
            { id: 'dm_1', type: 'dm', name: 'Алексей (Разработчик)', avatarText: 'А', messages: [
                { text: 'Привет! Зацени новую систему звонков.', sender: 'dm_1', time: '10:00' }
            ]},
            { id: 'chan_1', type: 'channel', name: 'Aura Updates', admin: 'system', avatarText: 'AU', subscribers: 1420, messages: [
                { text: 'Добро пожаловать в Aura Enterprise! В этой версии интегрированы каналы и VoIP модуль.', sender: 'system', time: '09:00' }
            ]}
        ];

        let chatsDB = [];

        /* ==========================================================================
           ИНИЦИАЛИЗАЦИЯ И АВТОРИЗАЦИЯ
           ========================================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { document.getElementById('splashBar').style.width = '100%'; }, 200);
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    checkAuth();
                }, 500);
            }, 1200);
        });

        function checkAuth() {
            const savedUser = localStorage.getItem('aura_enterprise_user');
            if (savedUser) {
                currentUser = savedUser;
                loadDatabase();
                launchApp();
            } else {
                document.getElementById('authModal').style.display = 'flex';
            }
        }

        function login() {
            const input = document.getElementById('authUsername').value.trim();
            if (input.length < 2) return alert('Имя слишком короткое');
            currentUser = input;
            localStorage.setItem('aura_enterprise_user', currentUser);
            document.getElementById('authModal').style.display = 'none';
            loadDatabase();
            launchApp();
        }

        function loadDatabase() {
            const savedDB = localStorage.getItem(`aura_db_${currentUser}`);
            if (savedDB) {
                chatsDB = JSON.parse(savedDB);
            } else {
                chatsDB = JSON.parse(JSON.stringify(defaultDB)); // глубокая копия
                saveDatabase();
            }
        }

        function saveDatabase() {
            localStorage.setItem(`aura_db_${currentUser}`, JSON.stringify(chatsDB));
        }

        function launchApp() {
            document.getElementById('app').style.display = 'flex';
            renderChatList();
        }

        /* ==========================================================================
           УПРАВЛЕНИЕ ЧАТАМИ И КАНАЛАМИ
           ========================================================================== */
        function renderChatList(filter = '') {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            
            chatsDB.filter(c => c.name.toLowerCase().includes(filter.toLowerCase())).forEach(chat => {
                const lastMsg = chat.messages.length > 0 ? chat.messages[chat.messages.length - 1].text : 'Нет сообщений';
                const isChannel = chat.type === 'channel';
                
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === activeChatId ? 'active' : ''}`;
                div.onclick = () => openChat(chat.id);
                
                div.innerHTML = `
                    <div class="avatar">${chat.avatarText || chat.name.charAt(0).toUpperCase()}</div>
                    <div class="chat-info">
                        <div class="chat-name">
                            ${chat.name} 
                            ${isChannel ? '<span class="channel-badge">Канал</span>' : ''}
                        </div>
                        <div class="chat-last-msg">${lastMsg}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function filterChats(val) { renderChatList(val); }

        function openChat(id) {
            activeChatId = id;
            const chat = chatsDB.find(c => c.id === id);
            if (!chat) return;

            document.getElementById('chatArea').style.display = 'flex';
            document.getElementById('currentChatName').innerText = chat.name;
            document.getElementById('currentChatAvatar').innerText = chat.avatarText || chat.name.charAt(0).toUpperCase();
            
            const subtext = document.getElementById('currentChatSubtext');
            const inputArea = document.getElementById('inputArea');
            const readOnlyBanner = document.getElementById('readOnlyBanner');
            const chatActions = document.getElementById('chatActions');

            if (chat.type === 'channel') {
                subtext.innerText = `${chat.subscribers || 1} подписчиков`;
                chatActions.style.display = 'none'; // В каналах нет звонков
                
                if (chat.admin === currentUser) {
                    inputArea.style.display = 'flex';
                    readOnlyBanner.style.display = 'none';
                } else {
                    inputArea.style.display = 'none';
                    readOnlyBanner.style.display = 'block';
                }
            } else {
                subtext.innerText = 'Личный чат';
                chatActions.style.display = 'flex'; // Показываем кнопки звонка
                inputArea.style.display = 'flex';
                readOnlyBanner.style.display = 'none';
            }

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden');
            }

            renderChatList(); // Обновляем выделение
            renderMessages();
        }

        function closeChat() {
            document.getElementById('chatArea').style.display = 'none';
            document.getElementById('sidebar').classList.remove('hidden');
            activeChatId = null;
            renderChatList();
        }

        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            const chat = chatsDB.find(c => c.id === activeChatId);
            if (!chat) return;

            chat.messages.forEach(msg => {
                const div = document.createElement('div');
                
                if (msg.type === 'system') {
                    div.className = 'message msg-system';
                    div.innerHTML = msg.text;
                } else {
                    const isOut = msg.sender === currentUser || (chat.type === 'channel' && chat.admin === currentUser);
                    div.className = `message ${isOut ? 'msg-out' : 'msg-in'}`;
                    div.innerHTML = `${msg.text} <span class="msg-time">${msg.time}</span>`;
                }
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeChatId) return;

            const chat = chatsDB.find(c => c.id === activeChatId);
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            chat.messages.push({ text: text, sender: currentUser, time: timeStr });
            saveDatabase();
            
            input.value = '';
            renderMessages();
            renderChatList(); // Обновляем последнее сообщение в списке
        }

        function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

        /* ==========================================================================
           СОЗДАНИЕ КАНАЛОВ
           ========================================================================== */
        function createChannel() {
            const name = document.getElementById('newChannelName').value.trim();
            if (name.length < 2) return alert('Введите название канала');

            const newChannel = {
                id: 'chan_' + Date.now(),
                type: 'channel',
                name: name,
                admin: currentUser,
                avatarText: name.substring(0, 2).toUpperCase(),
                subscribers: 1,
                messages: [{ type: 'system', text: `Канал «${name}» создан.` }]
            };

            chatsDB.unshift(newChannel);
            saveDatabase();
            closeModal('createChannelModal');
            document.getElementById('newChannelName').value = '';
            renderChatList();
            openChat(newChannel.id);
        }

        /* ==========================================================================
           СИСТЕМА ЗВОНКОВ (VOIP ENGINE)
           ========================================================================== */
        function initiateCall(type) {
            const chat = chatsDB.find(c => c.id === activeChatId);
            if (!chat || chat.type === 'channel') return;

            // Настройка UI модалки
            document.getElementById('callNameElem').innerText = chat.name;
            document.getElementById('callAvatarElem').innerText = chat.avatarText || chat.name.charAt(0).toUpperCase();
            document.getElementById('callStatusElem').innerText = type === 'video' ? 'Видеовызов. Ожидание...' : 'Аудиовызов. Установка соединения...';
            document.getElementById('callAvatarElem').classList.add('ringing');
            
            document.getElementById('callScreenModal').style.display = 'flex';
            
            // Имитация установки P2P соединения
            callEngine.active = true;
            callEngine.seconds = 0;
            
            setTimeout(() => {
                if(!callEngine.active) return; // Если сбросили до ответа
                document.getElementById('callStatusElem').innerText = '00:00';
                document.getElementById('callAvatarElem').classList.remove('ringing');
                
                callEngine.timerInterval = setInterval(() => {
                    callEngine.seconds++;
                    const m = Math.floor(callEngine.seconds / 60).toString().padStart(2, '0');
                    const s = (callEngine.seconds % 60).toString().padStart(2, '0');
                    document.getElementById('callStatusElem').innerText = `${m}:${s}`;
                }, 1000);
            }, 3000); // 3 секунды "гудков"
        }

        function endCall() {
            document.getElementById('callScreenModal').style.display = 'none';
            clearInterval(callEngine.timerInterval);
            document.getElementById('callAvatarElem').classList.remove('ringing');
            
            let durationStr = "отклонен";
            if (callEngine.seconds > 0) {
                const m = Math.floor(callEngine.seconds / 60).toString().padStart(2, '0');
                const s = (callEngine.seconds % 60).toString().padStart(2, '0');
                durationStr = `${m}:${s}`;
            }

            callEngine.active = false;
            callEngine.seconds = 0;

            // Запись в лог чата
            const chat = chatsDB.find(c => c.id === activeChatId);
            if (chat) {
                chat.messages.push({ 
                    type: 'system', 
                    text: `📞 Звонок завершен (${durationStr})` 
                });
                saveDatabase();
                renderMessages();
                renderChatList();
            }
        }

        function toggleMic() {
            const btn = document.getElementById('btnMic');
            btn.classList.toggle('active');
            btn.innerText = btn.classList.contains('active') ? '🔇' : '🎤';
        }

        function toggleVideo() {
            const btn = document.getElementById('btnVid');
            btn.classList.toggle('active');
            btn.innerText = btn.classList.contains('active') ? '🚫' : '📹';
        }

        /* ==========================================================================
           УТИЛИТЫ
           ========================================================================== */
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    </script>
</body>
</html>
