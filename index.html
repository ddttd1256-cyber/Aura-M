<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d0f12">
    <title>Aura Enterprise | Ultimate 3.0</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="splash" class="splash-screen">
        <h1 class="splash-title">AURA</h1>
        <p class="splash-subtitle">ENTERPRISE SYSTEM INITIALIZING...</p>
    </div>

    <div class="app-container" id="app" style="display: none;">
        
        <aside class="sidebar">
            <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Aura</h2>
                <button class="icon-btn" id="btnAddChat" style="width: 30px; height: 30px; font-size: 1rem;">+</button>
            </div>
            <div id="chatList" class="chat-list"></div>
        </aside>

        <main class="chat-area">
            <div id="noChatOverlay" class="no-chat-overlay">
                <div>
                    <h2>Выберите чат</h2>
                    <p>или создайте новый для начала общения</p>
                </div>
            </div>
            
            <header id="chatHeader" class="chat-header" style="display: none; justify-content: space-between;"></header>
            
            <div id="chatMessages" class="messages-area"></div>
            
            <div style="padding: 20px; border-top: 1px solid var(--glass-border); display: none; flex-direction: column;" id="inputAreaContainer">
                <div id="attachPanel" style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <button class="icon-btn" onclick="document.getElementById('bankModal').style.display='flex'" title="Aura Bank">🏦</button>
                    <button class="icon-btn" onclick="document.getElementById('pollModal').style.display='flex'" title="Опрос">📊</button>
                    <button class="icon-btn" id="btnGeo" title="Геопозиция">📍</button>
                </div>
                <div class="input-area" id="inputArea" style="display: flex; gap: 15px; padding: 0; border: none;">
                    <input type="text" id="msgInput" placeholder="Написать сообщение...">
                    <button class="btn btn-primary" id="btnSend">Отправить</button>
                </div>
            </div>
        </main>
    </div>

    <div id="authModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Вход в Aura</h2>
            <input type="text" id="authId" placeholder="Логин" class="modal-input">
            <input type="password" id="authPass" placeholder="Пароль" class="modal-input">
            <button class="btn btn-primary" id="btnLogin" style="width: 100%; margin-top: 15px;">Войти</button>
        </div>
    </div>

    <div id="bankModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="text-align: center;">
            <h2>🏦 Aura Bank</h2>
            <div style="font-size: 2rem; font-weight: 800; margin: 20px 0; color: var(--accent);">
                <span id="modalBalance">0</span> AUR
            </div>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Экономика и NFT-маркетплейс</p>
            <button class="btn btn-primary" id="btnBuyNFT" style="width: 100%; margin-bottom: 10px;">Купить NFT (100 AUR)</button>
            <button class="btn" style="width: 100%; background: transparent; border: 1px solid var(--glass-border); color: #fff;" onclick="document.getElementById('bankModal').style.display='none'">Закрыть</button>
        </div>
    </div>

    <div id="pollModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>📊 Создать опрос</h2>
            <input type="text" id="pollQuestion" placeholder="Ваш вопрос?" class="modal-input">
            <input type="text" id="pollOpt1" placeholder="Вариант 1" class="modal-input">
            <input type="text" id="pollOpt2" placeholder="Вариант 2" class="modal-input">
            <button class="btn btn-primary" id="btnSendPoll" style="width: 100%; margin-top: 20px;">Отправить опрос</button>
            <button class="btn" style="width: 100%; margin-top: 10px; background: transparent; border: 1px solid var(--glass-border); color: #fff;" onclick="document.getElementById('pollModal').style.display='none'">Отмена</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
